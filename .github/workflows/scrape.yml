name: ETF Scraper

# Two parallel jobs each scrape half of ISIN.csv (~3h each), then a backtest
# job runs once after both halves complete. Total wall time: ~3h. Daily.
#
# Required secrets (Settings → Secrets and variables → Actions):
#   VITE_SUPABASE_URL          Supabase project URL
#   SUPABASE_SERVICE_ROLE_KEY  Supabase service role key (full DB access)

on:
  schedule:
    # ZÁLOHA (od 20. 10. 2026). Hlavní spouštění = Supabase pg_cron: „scraper-spusteni“ út–pá
    # '30 1 * * 2-5' UTC (hotovo ~6:00 UTC před otevřením Xetry) a „scraper-spusteni-pondeli“
    # '0 5 * * 1' UTC (páteční bod zdroj přepisuje přes víkend) – přes workflow_dispatch s tokenem z Vault
    # (github_scraper_dispatch, fine-grained, jen etf-astro, Actions: write; platnost 1 rok).
    # Proč: GitHub plánované běhy zdržuje o 4–7 h (00:37 UTC startovalo ~05:10 UTC, '0 3' až 10:00 UTC).
    # Proč ráno a jen v pracovní dny: zdroj (justETF) má poslední obchodní den finální až ráno
    # po něm; víkendový scrape 18. 10. stáhl předběžný bod pátku → výnosy za období o ~1 p. b. vedle.
    # Tahle záloha běží jen, když se ten den scrape ještě nespustil (job hlidac níže).
    - cron: '23 8 * * 1-5'
  workflow_dispatch:
    inputs:
      backtest_only:
        description: 'Skip ETF scrape, run only backtest data fetch'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: etf-scraper
  cancel-in-progress: false

jobs:
  hlidac:
    name: Záloha – neběžel už dnes scrape?
    # Ruční / pg_cron spuštění (workflow_dispatch) běží vždy. Plánovaná záloha (schedule) se
    # přeskočí, pokud dnes (UTC) už existuje jiný běh, který neskončil skipped/cancelled/failure
    # (tj. běží nebo uspěl). Selhaný ranní běh tak záloha zopakuje (scraper má --resume).
    # Pozn.: i ruční běh s backtest_only=true (nic nestahuje) končí „success“ a zálohu ten den vypne.
    # Běh, který skončil „failure“ JEN kvůli jobu kontrola_nahrani (obě půlky scrapu uspěly, ale > 5 fondů se
    # nenahrálo do DB), se počítá jako proběhlý – opakovaný 3h scrape by stejné vadné fondy nenahrál znovu.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      spustit: ${{ steps.rozhodnuti.outputs.spustit }}
    steps:
      - id: rozhodnuti
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "spustit=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          dnes=$(date -u +%Y-%m-%d)
          dnesni=$(gh run list -R "$GITHUB_REPOSITORY" -w scrape.yml -L 20 --json databaseId,createdAt,conclusion \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }}) | select(.createdAt | startswith(\"$dnes\"))]")
          pocet=$(echo "$dnesni" | jq '[.[] | select(.conclusion != "skipped" and .conclusion != "cancelled" and .conclusion != "failure")] | length')
          for id in $(echo "$dnesni" | jq -r '.[] | select(.conclusion == "failure") | .databaseId'); do
            scrape_ok=$(gh run view "$id" -R "$GITHUB_REPOSITORY" --json jobs \
              --jq '[.jobs[] | select(.name | startswith("Scrape half"))] | (length > 0 and all(.conclusion == "success"))')
            if [ "$scrape_ok" = "true" ]; then echo "Běh $id selhal, ale scrape obou půlek uspěl (kontrola nahrání) – počítám jako proběhlý"; pocet=$((pocet + 1)); fi
          done
          echo "Dnešních jiných běhů: $pocet"
          if [ "$pocet" -gt 0 ]; then echo "spustit=false" >> "$GITHUB_OUTPUT"; else echo "spustit=true" >> "$GITHUB_OUTPUT"; fi

  refresh_isins:
    name: Refresh ISIN list from justETF sitemap
    # Synchronizuje ISIN.csv s aktuálním vesmírem ETF na justETF (přidá nové,
    # odebere delistované) PŘED scrapem. Zdroj = justETF sitemapy.
    needs: hlidac
    if: ${{ needs.hlidac.outputs.spustit == 'true' && github.event.inputs.backtest_only != 'true' }}
    runs-on: ubuntu-24.04  # zafixováno 1.10.2026: ubuntu-latest od 19.10. přechází na Ubuntu 26 – přejít vědomě a otestovaně
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ./scraper
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Sync ISIN.csv with justETF sitemap
        run: python refresh_isin_list.py

      - name: Commit updated ISIN.csv if changed
        run: |
          cd "$GITHUB_WORKSPACE"
          if git diff --quiet -- scraper/ISIN.csv; then
            echo "ISIN.csv beze změny – nic k commitu."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scraper/ISIN.csv
            git commit -m "chore(scraper): refresh ISIN list from justETF sitemap"
            git push || echo "::warning::push ISIN.csv se nezdařil (branch protection?) – scrape i tak poběží z artefaktu."
          fi

      - name: Upload refreshed ISIN.csv for scrape jobs
        uses: actions/upload-artifact@v4
        with:
          name: isin-csv
          path: scraper/ISIN.csv
          retention-days: 7

  scrape:
    name: Scrape half ${{ matrix.part }}
    # Čeká na refresh, aby scrapoval aktuální seznam (nové i bez delistovaných).
    needs: refresh_isins
    if: ${{ github.event.inputs.backtest_only != 'true' }}
    runs-on: ubuntu-24.04  # zafixováno 1.10.2026: ubuntu-latest od 19.10. přechází na Ubuntu 26 – přejít vědomě a otestovaně
    # Just under GitHub's hard 6h limit. Each half should finish in ~3h, this
    # is a safety ceiling.
    timeout-minutes: 359

    strategy:
      # If half 1 fails, still let half 2 finish — no wasted work.
      fail-fast: false
      matrix:
        part: [1, 2]

    defaults:
      run:
        working-directory: ./scraper

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      HEATMAP_OUTPUT_DIR: ${{ github.workspace }}/scraper/heatmap_output_${{ matrix.part }}
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Supabase secrets are set
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Required secrets VITE_SUPABASE_URL and/or SUPABASE_SERVICE_ROLE_KEY are missing."
            exit 1
          fi
          echo "Secrets present (URL host: $(echo $VITE_SUPABASE_URL | sed 's|https://||;s|/.*||'))"

      - name: Use refreshed ISIN.csv from justETF sitemap
        # Nahradí commitnutý ISIN.csv čerstvě synchronizovaným seznamem z refresh jobu.
        uses: actions/download-artifact@v4
        with:
          name: isin-csv
          path: ${{ github.workspace }}/scraper

      - name: Split ISIN.csv into halves and pick this half
        # Splits the input file into two roughly equal halves at runtime.
        # Each parallel matrix job picks its half via ${{ matrix.part }}.
        run: |
          set -euo pipefail
          TOTAL=$(tail -n +2 ISIN.csv | wc -l)
          HALF=$(( (TOTAL + 1) / 2 ))
          echo "Total ISINs: $TOTAL, half size: $HALF"

          # Header
          head -n 1 ISIN.csv > ISIN_split.csv

          if [ "${{ matrix.part }}" = "1" ]; then
            tail -n +2 ISIN.csv | head -n "$HALF" >> ISIN_split.csv
          else
            tail -n +2 ISIN.csv | tail -n +"$((HALF + 1))" >> ISIN_split.csv
          fi

          PART_COUNT=$(tail -n +2 ISIN_split.csv | wc -l)
          echo "::notice::Half ${{ matrix.part }} will process $PART_COUNT ISINs"

      - name: Restore scraper checkpoints (resume support)
        # If yesterday's run timed out partway, restore the checkpoint so today
        # picks up where we left off. Per-half cache key.
        uses: actions/cache/restore@v4
        with:
          path: scraper/justetf_complete_production/checkpoints
          key: scraper-checkpoints-part${{ matrix.part }}-${{ github.run_id }}
          restore-keys: |
            scraper-checkpoints-part${{ matrix.part }}-

      - name: ETF scrape (this half)
        run: python final_scraper.py --csv ISIN_split.csv --batch-size 50 --resume

      - name: Souhrn nahrání do DB (tahle půlka)
        # Scraper zapisuje počet nenahraných fondů (ISIN + chyba) do logs/nahrani_souhrn.json. Celkový práh
        # hlídá job kontrola_nahrani (obě půlky dohromady); tady jen výpis + varování u konkrétní půlky.
        if: ${{ always() }}
        run: |
          f=justetf_complete_production/logs/nahrani_souhrn.json
          if [ ! -f "$f" ]; then echo "::warning::Půlka ${{ matrix.part }}: souhrn nahrání chybí (scraper nedoběhl k nahrání?)"; exit 0; fi
          cat "$f"
          n=$(jq '.nenahrano' "$f")
          if [ "$n" -gt 0 ]; then echo "::warning::Půlka ${{ matrix.part }}: $n fondů se nenahrálo do DB: $(jq -r '[.nenahrane[].isin] | join(", ")' "$f")"; fi

      - name: Upload souhrnu nahrání
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: nahrani-half${{ matrix.part }}
          path: scraper/justetf_complete_production/logs/nahrani_souhrn.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Save scraper checkpoints
        # Always save, even on failure/timeout — that's the whole point of
        # caching: next run can resume.
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: scraper/justetf_complete_production/checkpoints
          key: scraper-checkpoints-part${{ matrix.part }}-${{ github.run_id }}

      - name: Upload run artifacts (logs + checkpoints)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: scraper-run-${{ github.run_id }}-half${{ matrix.part }}
          path: |
            scraper/justetf_complete_production/logs/
            scraper/justetf_complete_production/checkpoints/
            scraper/heatmap_output_${{ matrix.part }}/
          retention-days: 7
          if-no-files-found: ignore

  kontrola_nahrani:
    name: Kontrola – nahrály se fondy do DB?
    # 21.–22. 10. 2026 se denně 25 fondů nenahrálo (numeric field overflow shodil 5 dávek po 5) a běh přesto
    # skončil „success“ – zjistilo se to až z webu. Teď: > 5 nenahraných fondů (obě půlky dohromady) nebo chybějící
    # souhrn = job selže (GitHub pošle e-mail o selhaném běhu); 1–5 = varování v shrnutí běhu.
    needs: scrape
    if: ${{ always() && needs.scrape.result != 'skipped' && needs.scrape.result != 'cancelled' }}
    runs-on: ubuntu-24.04  # zafixováno jako ostatní joby
    timeout-minutes: 5
    steps:
      - name: Stáhnout souhrny obou půlek
        uses: actions/download-artifact@v4
        with:
          pattern: nahrani-half*
          path: souhrny
      - name: Vyhodnotit
        run: |
          PRAH=5
          celkem=0; chybi=""
          for part in 1 2; do
            f="souhrny/nahrani-half$part/nahrani_souhrn.json"
            if [ ! -f "$f" ]; then chybi="$chybi $part"; continue; fi
            n=$(jq '.nenahrano' "$f"); celkem=$((celkem + n))
            echo "Půlka $part: nahráno $(jq '.nahrano' "$f")/$(jq '.celkem' "$f"), nenahráno $n, mimo rozsah → None: $(jq '.oriznuto | length' "$f"), chyba: $(jq -r '.chyba // "-"' "$f")"
            jq -r '.nenahrane[] | "  \(.isin): \(.chyba[0:200])"' "$f"
          done
          {
            echo "### Kontrola nahrání do DB"
            echo "Nenahráno celkem: **$celkem** (práh $PRAH)${chybi:+, chybí souhrn půlky:$chybi}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$chybi" ]; then echo "::error::Chybí souhrn nahrání půlky:$chybi – nevíme, co se nahrálo"; exit 1; fi
          if [ "$celkem" -gt "$PRAH" ]; then echo "::error::Do DB se nenahrálo $celkem fondů (> $PRAH) – viz log výše"; exit 1; fi
          if [ "$celkem" -gt 0 ]; then echo "::warning::Do DB se nenahrálo $celkem fondů"; fi
          echo "OK"

  backtest:
    name: Backtest data (Yahoo Finance)
    # !! ODSTAVENO 2026-07-15 PO INCIDENTU – NEZAPÍNAT bez opravy skriptu !!
    #
    # 15.7.2026 tenhle job smazal 419 řádků `sp500` (celý ocas od 2024-11-06) a
    # produkční backtest pak ukazoval 611 812 Kč místo 738 487 Kč – živě lidem
    # přicházejícím z FB postu. Odhalilo se to náhodou přes komentář čtenáře.
    #
    # `scraper/fetch_index_data_yahoo.py` je rozbitý ve třech vrstvách:
    #  1) upload_to_supabase() dělá DELETE celé řady + INSERT po dávkách po 500.
    #     Když dávkování kdekoli spadne, zůstane useknutá řada (8000 = 16×500).
    #  2) Konvertuje VŠECHNO do EUR, jenže tabulka drží nativní měnu listingu
    #     a engine si převádí sám podle INDEX_SOURCE_CURRENCY (viz etf-nextjs-ssr
    #     src/lib/backtest/engine.ts). Doběhlý běh by zkorumpoval 21 USD indexů.
    #  3) Má zastaralé GBP tickery (IBGS.L/IBGM.L/IBGL.L) + natvrdo gbp_eur=1.15;
    #     eurové dluhopisy se přitom ručně přehrávaly z jiných listingů. Ověřeno:
    #     eur_govt_bond_1_3y ani _3_7y v DB neodpovídají ŽÁDNÉMU tickeru z configu.
    #
    # Data jsou dnes správná jen proto, že tenhle job opakovaně padal.
    # Náhrada se staví ověřeně (upsert, nativní měna, přírůstkově) – do té doby
    # hlídá integritu scripts/backtest/check_index_integrity.py v druhém repu.
    if: false
    needs: scrape
    runs-on: ubuntu-24.04  # zafixováno 1.10.2026: ubuntu-latest od 19.10. přechází na Ubuntu 26 – přejít vědomě a otestovaně
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ./scraper

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      HEATMAP_OUTPUT_DIR: ${{ github.workspace }}/scraper/heatmap_output
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Supabase secrets are set
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Required secrets are missing."
            exit 1
          fi

      - name: Run backtest data fetch
        run: python final_scraper.py --backtest-only

      - name: Upload backtest artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backtest-run-${{ github.run_id }}
          path: scraper/justetf_complete_production/logs/
          retention-days: 7
          if-no-files-found: ignore

  trigger_rebuild:
    name: Trigger Vercel rebuild
    # Runs after both scrape halves and backtest finish. Only fires the deploy
    # hook if the ETF scrape jobs actually succeeded — no point rebuilding a
    # site that's about to read the same stale data.
    needs: [scrape, backtest]
    if: ${{ needs.scrape.result == 'success' }}
    runs-on: ubuntu-24.04  # zafixováno 1.10.2026: ubuntu-latest od 19.10. přechází na Ubuntu 26 – přejít vědomě a otestovaně
    timeout-minutes: 5

    steps:
      - name: POST to Vercel deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK_URL secret is not set — skipping rebuild trigger."
            exit 0
          fi
          # Vercel deploy hook accepts an empty POST and returns 201 with the
          # queued job ID. Curl with -fsS so HTTP errors fail the step.
          response=$(curl -fsS -X POST "$DEPLOY_HOOK_URL")
          echo "Vercel deploy hook response:"
          echo "$response"
          echo "::notice::Vercel rebuild triggered. Site should be live with fresh data in ~20 minutes."
